<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md">

</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-outline-variant transition-all duration-200 input-glow" id="email" name="email" placeholder="admin@irwanmotor.com" required="" type="text">
</div>
</div>
<div class="space-y-sm">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm text-on-surface uppercase tracking-wider" for="password">Kata Sandi</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">Lupa Kata Sandi?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-outline-variant transition-all duration-200 input-glow" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded rounded-[4px] bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                            Ingat Saya
                        </label>
</div>
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-[10px] shadow-sm font-label-sm text-label-sm font-semibold text-on-primary bg-primary-container hover:bg-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 uppercase tracking-wider" type="submit">
                        Masuk
                        <span class="material-symbols-outlined ml-2 text-[18px]" data-icon="login">login</span>
</button>
